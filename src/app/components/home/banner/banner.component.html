<section class="banner">

  <div class="banner-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="container">
    <div class="banner-inner" [@bannerTrigger]>

      <div class="banner-text">
        <h1 class="banner-headline">{{ "Banner.name" | translate }}</h1>
        <p class="banner-tagline">{{ "Banner.jobTitle" | translate }}</p>
        <div class="banner-cta">
          <a (click)="scrollTo('contact')" class="btn-glow">{{ "Contact.Btn" | translate }}</a>
          <a (click)="scrollTo('about')" class="btn-ghost">{{ "Header.Item1" | translate }}</a>
        </div>
      </div>

      <div class="banner-logo-wrap">
        <div class="logo-ring ring-1"></div>
        <div class="logo-ring ring-2"></div>
        <img src="assets/images/logo.png" class="logo-float" alt="Sawaed Al Elm" />
      </div>

    </div>
  </div>

  <div class="scroll-hint">
    <div class="scroll-mouse">
      <span class="scroll-wheel"></span>
    </div>
  </div>

</section>

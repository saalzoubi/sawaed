<section class="section about" id='about'>
  <div class="container">
    <div class="section-box">
      <div data-aos="fade-up">
        <h3 class="section-title">
          <span class='n-section-title'>01.</span> {{ "AboutMe.Title" | translate }}
        </h3>
      </div>
      <div class="about-grid">
        <div class="about-text" data-aos="fade-up" data-aos-duration="800">
          <p *ngFor='let text of "AboutMe.Paragraphs" | translate' [innerHTML]="text"></p>
        </div>
        <div class="about-visual" data-aos="fade-up" data-aos-duration="800" data-aos-delay="150">
          <div class="logo-frame">
            <img src="assets/images/logo-with-name.png" alt="Sawaed Al Elm" />
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
